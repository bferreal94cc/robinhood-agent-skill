name: Refresh Robinhood Cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROBINHOOD_USERNAME: ${{ secrets.ROBINHOOD_USERNAME }}
      ROBINHOOD_PASSWORD: ${{ secrets.ROBINHOOD_PASSWORD }}
      ROBINHOOD_TOTP_SECRET: ${{ secrets.ROBINHOOD_TOTP_SECRET }}

    steps:
      - name: Validate workflow configuration
        id: validate
        run: |
          ready=true
          if [ -z "${ROBINHOOD_USERNAME:-}" ]; then
            echo "::notice::Skipping refresh-cache: ROBINHOOD_USERNAME is not configured."
            ready=false
          fi
          if [ -z "${ROBINHOOD_PASSWORD:-}" ]; then
            echo "::notice::Skipping refresh-cache: ROBINHOOD_PASSWORD is not configured."
            ready=false
          fi
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: ${{ steps.validate.outputs.ready == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ steps.validate.outputs.ready == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ steps.validate.outputs.ready == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install robin-stocks pyotp

      - name: Refresh cache
        if: ${{ steps.validate.outputs.ready == 'true' }}
        run: python scripts/refresh_cache.py --json-only --force
