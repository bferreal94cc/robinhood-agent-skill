name: Refresh Robinhood Cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-cache:
    if: ${{ secrets.ROBINHOOD_USERNAME != '' && secrets.ROBINHOOD_PASSWORD != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROBINHOOD_USERNAME: ${{ secrets.ROBINHOOD_USERNAME }}
      ROBINHOOD_PASSWORD: ${{ secrets.ROBINHOOD_PASSWORD }}
      ROBINHOOD_TOTP_SECRET: ${{ secrets.ROBINHOOD_TOTP_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install robin-stocks pyotp

      - name: Refresh cache
        run: python scripts/refresh_cache.py --json-only --force
